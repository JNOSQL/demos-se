jnosql.vector.database=products
# 6334 is the Qdrant gRPC port (6333 is the HTTP/UI port)
jnosql.qdrant.host=localhost
jnosql.qdrant.port=6334
jnosql.qdrant.tls=false
jnosql.qdrant.collection.distance=COSINE
# all-MiniLM-L6-v2 produces 384-dimensional embeddings
jnosql.qdrant.collection.vector.size=384
